[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-workflow"
version = "0.1.0"
description = "A reviewable batch-planning CLI for script-to-video production workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "phosphere33"}]
keywords = ["ai-video", "video-workflow", "storyboard", "batch-processing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
avwf = "avwf.cli:main"

[project.optional-dependencies]
transcription = ["openai-whisper>=20231117"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
